<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="b" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="b2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1c211f" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#faf9f5"/>

  <!-- left: pitch -->
  <g transform="translate(64,92)">
    <rect width="64" height="64" rx="16" fill="#2f6f62"/>
    <rect x="14" y="20" width="36" height="7" rx="3.5" fill="#faf9f5"/>
    <path d="M14 36 Q32 52 50 36" fill="none" stroke="#faf9f5" stroke-width="5" stroke-linecap="round"/>
    <path d="M20 44 L16 52 M28 48 L26 56 M36 48 L38 56 M44 44 L48 52" stroke="#faf9f5" stroke-width="4" stroke-linecap="round"/>
    <text x="84" y="46" fill="#1c211f" font-size="44" font-weight="700">Veil</text>
    <text x="0" y="122" fill="#1c211f" font-size="30" font-weight="700">Your chats, masked.</text>
    <text x="0" y="160" fill="#1c211f" font-size="30" font-weight="700">Nothing leaves your browser.</text>
    <g fill="#565f5b" font-size="17">
      <text x="0" y="214">Names · messages · photos · notifications</text>
      <text x="0" y="246">Blur, solid bars, or aliases like “Contact 7F3A2C”</text>
      <text x="0" y="278">Hover a contact, hold Alt, or “Show this chat”</text>
      <text x="0" y="310">Zero network access · PIN lock · Manifest V3</text>
    </g>
  </g>

  <!-- right: masked WhatsApp-like window -->
  <g transform="translate(640,56)" filter="url(#sh)">
    <rect width="500" height="408" rx="14" fill="#ffffff" stroke="#dcdad2" stroke-width="2"/>
    <path d="M0 14 Q0 0 14 0 L486 0 Q500 0 500 14 L500 36 L0 36 Z" fill="#f1f0ea"/>
    <circle cx="20" cy="18" r="5" fill="#e0685f"/><circle cx="37" cy="18" r="5" fill="#e6b04a"/><circle cx="54" cy="18" r="5" fill="#5fb073"/>
    <rect x="84" y="9" width="260" height="18" rx="9" fill="#ffffff" stroke="#dcdad2"/>
    <text x="96" y="22" fill="#565f5b" font-size="11" font-family="Consolas, monospace">web.whatsapp.com</text>
  </g>
  <g transform="translate(640,92)">
    <!-- chat list -->
    <rect x="1" y="0" width="190" height="371" fill="#ffffff"/>
    <line x1="191" y1="0" x2="191" y2="371" stroke="#ebeae4"/>
    <g>
      <g transform="translate(0,14)">
        <circle cx="30" cy="22" r="17" fill="#c9cfcc" filter="url(#b)"/>
        <rect x="56" y="10" width="78" height="10" rx="5" fill="#8a948f" filter="url(#b)"/>
        <rect x="56" y="28" width="104" height="8" rx="4" fill="#c2c8c5" filter="url(#b)"/>
        <text x="182" y="20" text-anchor="end" fill="#8a948f" font-size="10">6:10 pm</text>
      </g>
      <!-- hovered contact: revealed -->
      <g transform="translate(0,66)">
        <rect x="4" y="-4" width="184" height="52" rx="8" fill="#eef5f2"/>
        <circle cx="30" cy="22" r="17" fill="#2f6f62"/>
        <text x="30" y="27" text-anchor="middle" fill="#faf9f5" font-size="14" font-weight="700">R</text>
        <text x="56" y="19" fill="#1c211f" font-size="12.5" font-weight="600">Riya (hovered)</text>
        <text x="56" y="36" fill="#565f5b" font-size="11">See you at 8!</text>
        <text x="182" y="19" text-anchor="end" fill="#8a948f" font-size="10">5:42 pm</text>
      </g>
      <g transform="translate(0,118)">
        <circle cx="30" cy="22" r="17" fill="#c9cfcc" filter="url(#b)"/>
        <rect x="56" y="10" width="96" height="10" rx="5" fill="#8a948f" filter="url(#b)"/>
        <rect x="56" y="28" width="86" height="8" rx="4" fill="#c2c8c5" filter="url(#b)"/>
        <text x="182" y="20" text-anchor="end" fill="#8a948f" font-size="10">4:31 pm</text>
        <circle cx="174" cy="34" r="7" fill="#25d366"/><text x="174" y="38" text-anchor="middle" fill="#fff" font-size="9">2</text>
      </g>
      <g transform="translate(0,170)">
        <circle cx="30" cy="22" r="17" fill="#c9cfcc" filter="url(#b)"/>
        <rect x="56" y="10" width="70" height="10" rx="5" fill="#8a948f" filter="url(#b)"/>
        <rect x="56" y="28" width="110" height="8" rx="4" fill="#c2c8c5" filter="url(#b)"/>
        <text x="182" y="20" text-anchor="end" fill="#8a948f" font-size="10">3:58 pm</text>
      </g>
      <g transform="translate(0,222)">
        <circle cx="30" cy="22" r="17" fill="#c9cfcc" filter="url(#b)"/>
        <rect x="56" y="10" width="88" height="10" rx="5" fill="#8a948f" filter="url(#b)"/>
        <rect x="56" y="28" width="72" height="8" rx="4" fill="#c2c8c5" filter="url(#b)"/>
        <text x="182" y="20" text-anchor="end" fill="#8a948f" font-size="10">Yesterday</text>
      </g>
    </g>

    <!-- conversation -->
    <rect x="192" y="0" width="307" height="371" fill="#efeae2"/>
    <rect x="192" y="0" width="307" height="46" fill="#ffffff"/>
    <circle cx="216" cy="23" r="13" fill="#c9cfcc" filter="url(#b)"/>
    <rect x="238" y="13" width="104" height="20" rx="5" fill="#d9fdd3"/>
    <text x="246" y="27" fill="#0b3d2e" font-size="12" font-weight="600">Contact 57CD7E</text>
    <!-- show this chat pill -->
    <rect x="285" y="56" width="122" height="26" rx="13" fill="#1c211f" opacity=".85"/>
    <path d="M298 69 q6-7 12 0 q-6 7-12 0z" fill="none" stroke="#faf9f5" stroke-width="1.6"/>
    <circle cx="304" cy="69" r="2" fill="#faf9f5"/>
    <text x="316" y="73" fill="#faf9f5" font-size="11.5" font-weight="600">Show this chat</text>

    <rect x="208" y="96" width="150" height="88" rx="8" fill="#ffffff"/>
    <rect x="216" y="104" width="134" height="64" rx="5" fill="#7d8783" filter="url(#b2)"/>
    <text x="350" y="179" text-anchor="end" fill="#8a948f" font-size="9">3:57 pm</text>
    <rect x="208" y="192" width="132" height="30" rx="8" fill="#ffffff"/>
    <rect x="216" y="203" width="84" height="8" rx="4" fill="#b9c0bd" filter="url(#b)"/>
    <text x="332" y="217" text-anchor="end" fill="#8a948f" font-size="9">3:57 pm</text>
    <rect x="330" y="236" width="156" height="30" rx="8" fill="#d9fdd3"/>
    <rect x="338" y="247" width="96" height="8" rx="4" fill="#9fc79a" filter="url(#b)"/>
    <text x="478" y="261" text-anchor="end" fill="#6f8a6c" font-size="9">3:58 pm</text>
    <rect x="208" y="276" width="118" height="30" rx="8" fill="#ffffff"/>
    <rect x="216" y="287" width="70" height="8" rx="4" fill="#b9c0bd" filter="url(#b)"/>
    <text x="318" y="301" text-anchor="end" fill="#8a948f" font-size="9">4:31 pm</text>
    <rect x="200" y="325" width="291" height="34" rx="17" fill="#ffffff"/>
    <rect x="216" y="338" width="120" height="8" rx="4" fill="#c2c8c5" filter="url(#b)"/>
  </g>
</svg>
